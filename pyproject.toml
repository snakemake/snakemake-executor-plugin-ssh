[project]
authors = [{name = "Johannes Koester", email = "johannes.koester@uni-due.de"}]
dependencies = ["snakemake-interface-common>=1.23.0,<2", "snakemake-interface-executor-plugins>=9.4.0,<10", "tenacity>=9.1.4,<10"]
name = "snakemake-executor-plugin-ssh"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
snakemake_executor_plugin_ssh = { path = ".", editable = true }

[tool.pixi.tasks]
sshd-render-config = { cmd = 'jinja2 tests/sshserver/sshd_config.j2 -D cwd="$PWD" > tests/sshserver/sshd_config', default-environment = "dev" }
sshd = { cmd = '$(which sshd) -f tests/sshserver/sshd_config -D', depends-on = ["sshd-render-config"], default-environment = "dev" }
test = { cmd = 'pytest -vs', default-environment = "dev" }
#test = { cmd = 'run-concurrently "$(which sshd) -f tests/sshserver/sshd_config -D" "pytest -vs"', depends-on = ["sshd-render-config"], default-environment = "dev" }

[tool.pixi.environments]
dev = { features = ["dev"] }

[tool.pixi.feature.dev.dependencies]
openssh = "*"

[tool.pixi.feature.dev.pypi-dependencies]
jinja2-cli = ">=1.0.1,<2"
run-concurrently = ">=0.2.5,<0.3"
ruff = ">=0.15.12, <0.16"
coverage = ">=7.13.5, <8"
pytest = ">=9.0.3, <10"
snakemake-storage-plugin-fs = ">=1.1.3, <2"
snakemake = ">=9.20.0, <10"
