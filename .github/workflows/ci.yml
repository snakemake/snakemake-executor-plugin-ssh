name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          environments: dev

      - name: Formatting
        run: pixi run format --check
      
      - name: Linting
        run: pixi run lint

  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          environments: dev
      
      - run: |
          chmod 700 tests/sshserver
          chmod 600 tests/sshserver/*

      - run: pixi run sshd &

      - name: Run pytest
        run: pixi run test
