name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          environments: dev

      - name: Formatting
        run: pixi run format --check
      
      - name: Linting
        run: poetry run lint

  testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: prefix-dev/setup-pixi@v0
        with:
          environments: dev

      - uses: JarvusInnovations/background-action@v1
        with:
          run: "pixi run sshd"
          wait-for: 5s

      - name: Run pytest
        run: pixi run test
